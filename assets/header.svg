<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 230" width="100%" role="img" aria-label="Sumit Mehta — AI Systems, Android & Full-Stack Engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141312"/>
      <stop offset="55%" stop-color="#1E1B18"/>
      <stop offset="100%" stop-color="#2D201B"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="50%" stop-color="#F2CC8F"/>
      <stop offset="100%" stop-color="#81B29A"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="230" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1098" height="228" rx="19" fill="none" stroke="#3A332D" stroke-width="1.5"/>

  <!-- Subtle glowing nodes / neural motif on right -->
  <g opacity="0.9">
    <circle cx="955" cy="115" r="72" fill="#E07A5F" opacity="0.10">
      <animate attributeName="r" values="66;80;66" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="955" cy="115" r="46" fill="#E07A5F" opacity="0.16">
      <animate attributeName="r" values="42;52;42" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(925, 87)" fill="#F7F4EF">
      <rect x="0" y="18" width="7" height="20" rx="3.5">
        <animate attributeName="height" values="14;36;14" dur="1.15s" repeatCount="indefinite"/>
        <animate attributeName="y" values="21;10;21" dur="1.15s" repeatCount="indefinite"/>
      </rect>
      <rect x="13" y="10" width="7" height="36" rx="3.5" fill="#F2CC8F">
        <animate attributeName="height" values="22;46;22" dur="0.95s" repeatCount="indefinite"/>
        <animate attributeName="y" values="17;5;17" dur="0.95s" repeatCount="indefinite"/>
      </rect>
      <rect x="26" y="6" width="7" height="44" rx="3.5" fill="#E07A5F">
        <animate attributeName="height" values="28;52;28" dur="1.25s" repeatCount="indefinite"/>
        <animate attributeName="y" values="14;2;14" dur="1.25s" repeatCount="indefinite"/>
      </rect>
      <rect x="39" y="12" width="7" height="32" rx="3.5" fill="#81B29A">
        <animate attributeName="height" values="18;42;18" dur="1.0s" repeatCount="indefinite"/>
        <animate attributeName="y" values="19;7;19" dur="1.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="52" y="20" width="7" height="16" rx="3.5">
        <animate attributeName="height" values="12;30;12" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="22;13;22" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Status pill -->
  <rect x="46" y="38" width="286" height="28" rx="14" fill="#2A221E" stroke="#E07A5F" stroke-width="1"/>
  <circle cx="64" cy="52" r="4.5" fill="#81B29A">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="77" y="57" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#F2CC8F" letter-spacing="0.8">OPEN TO ROLES &amp; COLLABORATIONS</text>

  <!-- Title & Subtitle -->
  <text x="46" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#F7F4EF">Hi, I'm Sumit Mehta</text>
  <text x="46" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="19" fill="#D4CBC2">AI Systems · Android &amp; Full-Stack Engineer</text>
  <text x="46" y="177" font-family="Consolas, 'Fira Code', monospace" font-size="14" fill="#A69C91">On-Device Voice Agents (ONNX) · Kotlin · Go · TypeScript · Python · C++ / DSA</text>

  <!-- Accent progress line -->
  <rect x="46" y="196" width="460" height="3.5" rx="2" fill="url(#lineGrad)">
    <animate attributeName="width" values="380;540;380" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
